<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TimeThread | My Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Manage My Availability</h3>
        <a th:href="@{/dashboard}" class="btn btn-outline-dark btn-sm">Back to Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
            <form th:action="@{/availability}" method="post" class="row g-3">
                <div class="col-12">
                    <label class="form-label fw-bold small">Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Start Time</label>
                    <input type="time" name="startTime" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">End Time</label>
                    <input type="time" name="endTime" class="form-control" required>
                </div>
                <div class="col-12 text-end mt-3">
                    <button type="submit" class="btn btn-dark px-4">Add Time Slot</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Your Free Slots</h5>
            <div th:if="${availabilities.isEmpty()}" class="text-muted small">No availability slots added yet.</div>
            <ul class="list-group list-group-flush">
                <li th:each="a : ${availabilities}" class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <div>
                        <span class="fw-bold text-dark" th:text="${a.date}">Date</span>
                        <span class="text-muted ms-2" th:text="${a.startTime + ' - ' + a.endTime}">Time</span>
                    </div>
                    <form th:action="@{'/availability/delete/' + ${a.id}}" method="post" class="mb-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="bi bi-trash"></i></button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
