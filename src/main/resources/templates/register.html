<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TimeThread | Join</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .auth-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            background: white;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            background-color: #f1f3f5;
            border: 1px solid transparent;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #dee2e6;
            box-shadow: 0 0 0 0.25rem rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            background-color: #212529;
            border: none;
        }
        .btn-primary:hover {
            background-color: #343a40;
        }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <h2 class="fw-bold mb-1">TimeThread</h2>
    <p class="text-muted mb-4">Create your student account.</p>

    <form id="registrationForm">
        <div class="mb-3 text-start">
            <label for="email" class="form-label fw-semibold small">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required>
        </div>

        <div class="mb-4 text-start">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Join Workspace</button>

        <p class="small text-muted">Already have an account? <a href="/login" class="text-decoration-none text-dark fw-bold">Sign in</a></p>
    </form>
</div>

<!-- The JavaScript Bridge -->
<script>
    document.getElementById('registrationForm').addEventListener('submit', async function(event) {
        // 1. Stop the browser from submitting the old way
        event.preventDefault();

        // 2. Grab the data
        const emailValue = document.getElementById('email').value;
        const passwordValue = document.getElementById('password').value;

        try {
            // 3. Send it as JSON to match your Java @RestController
            const response = await fetch('/students/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: emailValue, password: passwordValue })
            });

            if (response.ok) {
                alert('Success! Student account created.');
            } else {
                const errorMessage = await response.text();
                alert('Error: ' + errorMessage);
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('Could not connect to the server.');
        }
    });
</script>
</body>
</html>
