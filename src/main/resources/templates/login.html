<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TimeThread | Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .auth-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            background: white;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            background-color: #f1f3f5;
            border: 1px solid transparent;
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #dee2e6;
            box-shadow: 0 0 0 0.25rem rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            background-color: #212529;
            border: none;
        }
        .btn-primary:hover {
            background-color: #343a40;
        }
    </style>
</head>
<body>

<div class="auth-card text-center">
    <h2 class="fw-bold mb-1">TimeThread</h2>
    <p class="text-muted mb-4">Welcome back to your workspace.</p>

    <form id="loginForm" action="/login" method="POST">

        <div class="mb-3 text-start">
            <label for="email" class="form-label fw-semibold small">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required>
        </div>

        <div class="mb-4 text-start">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Log in</button>

        <p class="small text-muted">Don't have an account? <a href="/register" class="text-decoration-none text-dark fw-bold">Sign up</a></p>
    </form>
</div>

</body>
</html>
