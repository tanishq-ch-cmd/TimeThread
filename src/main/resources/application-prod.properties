# PostgreSQL Database Connection (Mapped to Railway Variables)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" creates the tables the first time it runs, and updates them if you change your Java models later
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=false

# Render/Railway Port Configuration
# Railway provides a $PORT variable automatically, this tells Spring to bind to it
server.port=${PORT:8080}